services:
  - type: web
    name: netpulse-backend-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://your-frontend.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: DEMO_MODE
        value: false